<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · V17</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: rgba(255, 255, 255, 0.9);
        background:
          radial-gradient(ellipse 100% 70% at 10% 0%, rgba(20, 184, 166, 0.6) 0%, transparent 55%),
          radial-gradient(ellipse 75% 55% at 90% 10%, rgba(16, 185, 129, 0.45) 0%, transparent 50%),
          linear-gradient(160deg, #0c3d38 0%, #1a6e63 40%, #104e48 100%);
      }
      .card {
        width: 100%;
        max-width: 380px;
        text-align: center;
        padding: 32px 24px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.14);
        border: 1px solid rgba(255, 255, 255, 0.22);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }
      .logo {
        width: 56px; height: 56px; margin: 0 auto 18px;
        border-radius: 16px; background: linear-gradient(135deg, #0d9488, #0f766e);
        display: flex; align-items: center; justify-content: center;
        font-weight: 800; font-size: 18px; letter-spacing: -0.02em;
      }
      h1 { font-size: 19px; font-weight: 700; margin: 0 0 8px; }
      p { font-size: 14px; line-height: 1.55; color: rgba(255, 255, 255, 0.6); margin: 0 0 22px; }
      button {
        width: 100%; padding: 13px 0; border: none; border-radius: 12px;
        background: rgba(16, 185, 129, 0.85); color: #fff;
        font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">V17</div>
      <h1>Keine Verbindung</h1>
      <p>
        Die App braucht eine Internetverbindung, um Buchungen und Reinigungen zu laden.
        Sobald du wieder online bist, funktioniert alles wie gewohnt.
      </p>
      <button onclick="location.reload()">Erneut versuchen</button>
    </div>
    <script>
      addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
