services:
  - type: web
    name: vils17-kalender
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SMOOBU_API_KEY
        sync: false
      - key: SMOOBU_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: TWILIO_ENABLED
        value: "false"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: LAUNDRY_API_ENABLED
        value: "false"
      - key: LAUNDRY_API_URL
        sync: false
      - key: LAUNDRY_API_KEY
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_MAILTO
        sync: false
      - key: DREAME_EMAIL
        sync: false
      - key: DREAME_PASSWORD
        sync: false
      - key: DREAME_APARTMENT_ID
        sync: false
      - key: DREAME_DEVICE_ID
        sync: false
      - key: IMAP_HOST
        sync: false
      - key: IMAP_PORT
        sync: false
      - key: IMAP_USER
        sync: false
      - key: IMAP_PASS
        sync: false
      - key: IMAP_FOLDER
        sync: false

  - type: cron
    name: smoobu-sync
    env: node
    region: frankfurt
    plan: free
    schedule: "*/15 * * * *"
    buildCommand: echo "ready"
    startCommand: |
      curl -s --max-time 90 --connect-timeout 30 -X POST "${NEXT_PUBLIC_APP_URL}/api/bookings/sync" \
        -H "x-cron-secret: ${CRON_SECRET}" \
        -H "Content-Type: application/json" && \
      curl -s --max-time 30 --connect-timeout 10 -X POST "${NEXT_PUBLIC_APP_URL}/api/cron/push-reminders" \
        -H "x-cron-secret: ${CRON_SECRET}" \
        -H "Content-Type: application/json"
    envVars:
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: email-import
    env: node
    region: frankfurt
    plan: free
    schedule: "*/30 * * * *"
    buildCommand: echo "ready"
    startCommand: |
      curl -s --max-time 90 --connect-timeout 30 -X POST "${NEXT_PUBLIC_APP_URL}/api/cron/email-import" \
        -H "x-cron-secret: ${CRON_SECRET}" \
        -H "Content-Type: application/json"
    envVars:
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: dreame-status
    env: node
    region: frankfurt
    plan: free
    schedule: "*/30 * * * *"
    buildCommand: echo "ready"
    startCommand: |
      curl -s --max-time 60 --connect-timeout 30 -X POST "${NEXT_PUBLIC_APP_URL}/api/cron/dreame-status" \
        -H "x-cron-secret: ${CRON_SECRET}" \
        -H "Content-Type: application/json"
    envVars:
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: dreame-start
    env: node
    region: frankfurt
    plan: free
    schedule: "0 8 * * *"
    buildCommand: echo "ready"
    startCommand: |
      curl -s --max-time 60 --connect-timeout 30 -X POST "${NEXT_PUBLIC_APP_URL}/api/cron/dreame-start" \
        -H "x-cron-secret: ${CRON_SECRET}" \
        -H "Content-Type: application/json"
    envVars:
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: CRON_SECRET
        sync: false
